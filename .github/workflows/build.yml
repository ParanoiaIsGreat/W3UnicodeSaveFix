name: Build W3UnicodeSaveFix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build EXE
        shell: pwsh
        run: |
          Invoke-ps2exe `
            -InputFile .\W3UnicodeSaveFix.ps1 `
            -OutputFile .\W3UnicodeSaveFix.exe `
            -NoConsole `
            -Title "W3UnicodeSaveFix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: W3UnicodeSaveFix
          path: W3UnicodeSaveFix.exe
